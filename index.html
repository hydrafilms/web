<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hydrangea Films</title>
<link rel="icon" type="image/png" href="assets/favicon.png?v=1">
<link rel="apple-touch-icon" href="assets/favicon.png?v=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<!-- ===== PRELOADER ===== -->
<div id="preloader">
  <video id="preloader-desktop" class="preloader-video" muted playsinline preload="auto" src="assets/HYDRANGEA_TRAILER.mp4"></video>
  <video id="preloader-mobile" class="preloader-video" muted playsinline preload="auto" src="assets/HYDRANGEA_TRAILER_MB.mp4"></video>
</div>

<!-- ===== HEADER ===== -->
<header id="site-header">
  <a href="#home" class="logo" data-target="home">
    <img src="assets/TITLE_HYDRANGEA_2.png" alt="Hydrangea Films">
  </a>
  <nav id="main-nav">
    <button class="nav-link active" data-target="home" data-en="Home" data-fr="Accueil">Home</button>
    <button class="nav-link" data-target="mission" data-en="Mission" data-fr="Mission">Mission</button>
    <button class="nav-link" data-target="projects" data-en="Projects" data-fr="Projets">Projects</button>
    <button class="nav-link" data-target="contact" data-en="Contact" data-fr="Contact">Contact</button>
    <button id="lang-toggle" data-en="FR" data-fr="EN">FR</button>
  </nav>
</header>

<main>

  <!-- ===== HOME ===== -->
  <section id="home" class="section">
    <video id="demo-reel" class="bg-video" muted loop playsinline preload="none" poster="assets/DEMOREEL-POSTER.jpg" src="assets/DEMOREEL.mp4"></video>
  </section>

  <!-- ===== MISSION ===== -->
  <section id="mission" class="section">
    <img class="mission-bg" src="assets/mission-bg.png" alt="">
    <div class="mission-inner">

      <p class="mission-line align-left">
        <img class="lang-img" src="assets/MISSION-1.png"
             data-en-src="assets/MISSION-1.png"
             data-fr-src="assets/MISSION-1-fr.png"
             alt="Hydrangea Films is committed to promoting diversity, equity and inclusion in the world of cinema.">
      </p>

      <p class="mission-line">
        <img class="lang-img" src="assets/MISSION-2.png"
             data-en-src="assets/MISSION-2.png"
             data-fr-src="assets/MISSION-2-fr.png"
             alt="At the heart of our mission is the belief that films should reflect the diverse voices and perspectives that exist in our community.">
      </p>

      <p class="mission-line align-right">
        <img class="lang-img" src="assets/MISSION-3.png"
             data-en-src="assets/MISSION-3.png"
             data-fr-src="assets/MISSION-3-fr.png"
             alt="We believe that every artist should be given the opportunity to create and express themselves through the art of filmmaking.">
      </p>

    </div>
  </section>

  <!-- ===== PROJECTS ===== -->
  <section id="projects" class="section">
    <div class="projects-heading">
      <img class="lang-img" src="assets/TITLE_PROJECTS.png"
           data-en-src="assets/TITLE_PROJECTS.png"
           data-fr-src="assets/TITLE_PROJECTS-FR.png"
           alt="Projects">
    </div>
    <div class="accordion" id="accordion">

      <div class="accordion-item">
        <img class="accordion-still" src="assets/ABSOLVED-STILL.jpg" alt="">
        <video class="accordion-video" muted loop playsinline preload="none" src="assets/ABSOLVED.mp4"></video>
        <div class="accordion-caption">
          <img class="lang-img caption-title" src="assets/ABSOLVED.png" data-en-src="assets/ABSOLVED.png" data-fr-src="assets/ABSOLVED.png" alt="Absolved">
        </div>
      </div>

      <div class="accordion-item">
        <img class="accordion-still" src="assets/pg.png" alt="">
        <video class="accordion-video" muted loop playsinline preload="none" src="assets/PG.mp4"></video>
        <div class="accordion-caption">
          <img class="lang-img caption-title" src="assets/PLAYGROUND.png" data-en-src="assets/PLAYGROUND.png" data-fr-src="assets/PLAYGROUND.png" alt="Playground">
        </div>
      </div>

      <div class="accordion-item">
        <img class="accordion-still" src="assets/WILDFLOWER-STILL.png" alt="">
        <video class="accordion-video" muted loop playsinline preload="none" src="assets/WILDFLOWER.mp4"></video>
        <div class="accordion-caption">
          <img class="lang-img caption-title" src="assets/WILDFLOWER.png" data-en-src="assets/WILDFLOWER.png" data-fr-src="assets/WILDFLOWER.png" alt="Wildflower">
        </div>
      </div>

      <div class="accordion-item">
        <img class="accordion-still" src="assets/OLIVIA.png" alt="Olivia">
        <video class="accordion-video" muted loop playsinline preload="none" src="assets/OLIVIA.mp4"></video>
      </div>

      <div class="accordion-item">
        <img class="accordion-still" src="assets/IRH.png" alt="">
        <video class="accordion-video" muted loop playsinline preload="none" src="assets/IRH.mp4"></video>
        <div class="accordion-caption">
          <img class="lang-img caption-title" src="assets/IMRIGHTHERE.png" data-en-src="assets/IMRIGHTHERE.png" data-fr-src="assets/IMRIGHTHERE.png" alt="I'm Right Here">
        </div>
      </div>

      <div class="accordion-item">
        <img class="accordion-still" src="assets/SHIMANAGASHI.jpg" alt="">
        <video class="accordion-video" muted loop playsinline preload="none" src="assets/SHIMANAGASHI.mp4"></video>
        <div class="accordion-caption">
          <img class="lang-img caption-title" src="assets/SHIMANAGASHI.png" data-en-src="assets/SHIMANAGASHI.png" data-fr-src="assets/SHIMANAGASHI.png" alt="Shimanagashi">
        </div>
      </div>

      <div class="accordion-item">
        <img class="accordion-still" src="assets/TATMC-STILL.png" alt="">
        <video class="accordion-video" muted loop playsinline preload="none" src="assets/TATMC.mp4"></video>
        <div class="accordion-caption">
          <img class="lang-img caption-title" src="assets/TATMC.png" data-en-src="assets/TATMC.png" data-fr-src="assets/TATMC.png" alt="TATMC">
        </div>
      </div>

      <div class="accordion-item">
        <img class="accordion-still" src="assets/COCOON_S.png" alt="">
        <video class="accordion-video" muted loop playsinline preload="none" src="assets/COCOON-STILL.mp4"></video>
        <div class="accordion-caption">
          <img class="lang-img caption-title" src="assets/COCOON.png" data-en-src="assets/COCOON.png" data-fr-src="assets/COCOON.png" alt="Cocoon">
        </div>
      </div>

    </div>
  </section>

  <!-- ===== CONTACT ===== -->
  <section id="contact" class="section">
    <img class="contact-bg" src="assets/contact-bg.png" alt="">
    <div class="contact-inner">
      <img class="lang-img contact-title-img" src="assets/CONTACT-1.png"
           data-en-src="assets/CONTACT-1.png"
           data-fr-src="assets/CONTACT-1%20-fr.png"
           alt="Let's bring your vision to life">
      <img class="lang-img contact-subtitle-img" src="assets/CONTACT-2.png"
           data-en-src="assets/CONTACT-2.png"
           data-fr-src="assets/CONTACT-2-FR.png"
           alt="Get in touch">

      <form id="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
        <div class="form-row">
          <input type="text" name="firstName" data-en-ph="First name" data-fr-ph="Prénom" placeholder="First name" required>
          <input type="text" name="lastName" data-en-ph="Last name" data-fr-ph="Nom" placeholder="Last name" required>
        </div>
        <input type="email" name="email" data-en-ph="Email" data-fr-ph="Courriel" placeholder="Email" required>
        <input type="text" name="address" data-en-ph="Address" data-fr-ph="Adresse" placeholder="Address">
        <textarea name="message" rows="5" data-en-ph="Message" data-fr-ph="Message" placeholder="Message" required></textarea>

        <p class="checkbox-label" data-en="I am a" data-fr="Je suis">I am a</p>
        <div class="checkbox-group">
          <label><input type="checkbox" name="role" value="Filmmaker"><span data-en="Filmmaker" data-fr="Cinéaste">Filmmaker</span></label>
          <label><input type="checkbox" name="role" value="Music Artist"><span data-en="Music Artist" data-fr="Artiste musical">Music Artist</span></label>
          <label><input type="checkbox" name="role" value="Producer"><span data-en="Producer" data-fr="Producteur">Producer</span></label>
          <label><input type="checkbox" name="role" value="Other"><span data-en="Other" data-fr="Autre">Other</span></label>
        </div>

        <button type="submit" data-en="Send" data-fr="Envoyer">Send</button>
      </form>
    </div>
  </section>

</main>

<script src="script.js?v=6"></script>
</body>
</html>
